const TTS="speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined";
let medGen=0,medIdx=-1,wake=null,medTimer=null;
function opts(sel,v){sel.innerHTML=HEADS.map((h,i)=>'<option value="'+i+'">Head '+(i+1)+' · v.'+h[0]+'</option>').join("");sel.value=v;}
function drawMed(){opts($("medFrom"),S.med.from);opts($("medTo"),S.med.to);$("medPause").value=String(S.med.pause);$("medTwice").value=String(S.med.twice);$("medRate").value=String(S.med.rate);
  fillVoices();$("medNote").textContent=TTS?"Tip: keep the screen on — most phones stop the voice when the screen locks.":"This device can't speak aloud, so the heads will show one by one with the same pauses.";}
["medFrom","medTo","medPause","medTwice","medRate"].forEach(id=>$(id).onchange=()=>{S.med=Object.assign(S.med,{from:+$("medFrom").value,to:+$("medTo").value,pause:+$("medPause").value,twice:+$("medTwice").value,rate:+$("medRate").value});
  if(S.med.to<S.med.from){S.med.to=S.med.from;$("medTo").value=S.med.from;}sv();});
/* English voices, British first; "Enhanced"/"Premium" ones sound the most human */
function voiceScore(v){let n=0;if(/en[-_]GB/i.test(v.lang))n+=100;if(/premium/i.test(v.name))n+=60;if(/enhanced|natural|neural/i.test(v.name))n+=50;
  if(/Arthur|Daniel|Serena|Kate|Martha|Oliver|Stephanie|Jamie|Google UK English/i.test(v.name))n+=20;if(/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Junior|Ralph|Fred|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i.test(v.name))n-=200;return n;}
function englishVoices(){if(!TTS)return [];return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a)||a.name.localeCompare(b.name));}
function voiceFor(){const vs=englishVoices();return vs.find(v=>v.voiceURI===S.med.voice)||vs[0]||null;}
function fillVoices(){const sel=$("medVoice");if(!sel)return;const vs=englishVoices();
  if(!vs.length){sel.innerHTML='<option>Phone default voice</option>';sel.disabled=true;$("medTry").disabled=!TTS;return;}
  sel.disabled=false;$("medTry").disabled=false;const cur=voiceFor();
  sel.innerHTML=vs.map(v=>'<option value="'+esc(v.voiceURI)+'">'+esc(v.name.replace(/\s*\(.*?\)\s*/g," ").trim())+(/premium/i.test(v.name)?" · Premium":/enhanced/i.test(v.name)?" · Enhanced":"")+(/en[-_]GB/i.test(v.lang)?" · British":/en[-_]AU/i.test(v.lang)?" · Australian":/en[-_]IE/i.test(v.lang)?" · Irish":/en[-_]US/i.test(v.lang)?" · American":"")+'</option>').join("");
  if(cur)sel.value=cur.voiceURI;}
$("medVoice").onchange=()=>{S.med.voice=$("medVoice").value;sv();};
$("medTry").onclick=()=>{if(!TTS)return;try{speechSynthesis.cancel();}catch(e){}const u=new SpeechSynthesisUtterance("All things that are, are moved.");u.rate=S.med.rate;const v=voiceFor();if(v){u.voice=v;u.lang=v.lang;}speechSynthesis.speak(u);};
function sayIt(text,gen){return new Promise(res=>{if(!TTS||gen!==medGen){setTimeout(res,TTS?0:Math.max(2500,text.split(/\s+/).length*450));return;}
  const u=new SpeechSynthesisUtterance(text.replace(/\bIDEAS\b/g,"ideas"));u.rate=S.med.rate;u.lang="en-GB";
  const pref=voiceFor();if(pref){u.voice=pref;u.lang=pref.lang;}
  let done=false;const fin=()=>{if(done)return;done=true;res();};u.onend=fin;u.onerror=fin;
  setTimeout(fin,(text.split(/\s+/).length*0.6/S.med.rate+4)*1000); /* some phones never send "end" */
  speechSynthesis.speak(u);});}
function wait(ms,gen){return new Promise(res=>{const t0=Date.now();const step=()=>{if(gen!==medGen)return res();const f=Math.min(1,(Date.now()-t0)/ms);$("medBar").style.width=(f*100)+"%";if(f>=1)return res();medTimer=setTimeout(step,250);};step();});}
async function medRun(from){const gen=++medGen;$("medGo").textContent="❚❚ Pause";$("medStop").disabled=false;
  try{if(navigator.wakeLock)wake=await navigator.wakeLock.request("screen");}catch(e){wake=null;}
  for(let i=from;i<=S.med.to;i++){if(gen!==medGen)return;medIdx=i;const h=HEADS[i];
    $("medNow").innerHTML='<small>HEAD '+(i+1)+' · VERSE '+h[0]+'</small>'+esc(h[1]);$("medBar").style.width="0";
    await sayIt("Head "+(i+1)+".",gen);if(gen!==medGen)return;await wait(1200,gen);if(gen!==medGen)return;$("medBar").style.width="0";await sayIt(h[1],gen);
    for(let k=1;k<S.med.twice;k++){if(gen!==medGen)return;await wait(2500,gen);await sayIt(h[1],gen);}
    if(gen!==medGen)return;await wait(S.med.pause*1000,gen);}
  if(gen!==medGen)return;await sayIt("Here the Heads end. Rest in what you have heard.",gen);medEnd(true);}
function medEnd(fin){medGen++;clearTimeout(medTimer);if(TTS)try{speechSynthesis.cancel();}catch(e){}if(wake){try{wake.release();}catch(e){}wake=null;}
  $("medGo").textContent=fin?"▶ Begin again":"▶ Begin";$("medStop").disabled=true;$("medBar").style.width="0";
  if(fin){$("medNow").innerHTML='<small>COMPLETE</small>All heads read. Sit with them a moment.';medIdx=-1;}}
function medPause(){medGen++;clearTimeout(medTimer);if(TTS)try{speechSynthesis.cancel();}catch(e){}if(wake){try{wake.release();}catch(e){}wake=null;}$("medGo").textContent="▶ Resume";}
function medStop(){if(medIdx<0&&$("medStop").disabled)return;medEnd(false);medIdx=-1;$("medNow").innerHTML='<small>SPOKEN HEADS</small>Stopped. Press Begin to start again.';}
$("medGo").onclick=()=>{const t=$("medGo").textContent;if(/Pause/.test(t)){medPause();return;}
  const start=/Resume/.test(t)&&medIdx>=0?medIdx:S.med.from;
  if(TTS){try{speechSynthesis.cancel();const w=new SpeechSynthesisUtterance(" ");w.volume=0;speechSynthesis.speak(w);}catch(e){}} /* unlock the voice inside this tap (iPhone) */
  medRun(start);};
$("medStop").onclick=medStop;
document.addEventListener("visibilitychange",()=>{if(document.hidden&&/Pause/.test($("medGo").textContent))medPause();}); /* screen locked or app switched: pause, resume later from the same head */
window.addEventListener("pagehide",()=>{medGen++;if(TTS)try{speechSynthesis.cancel();}catch(e){}});
if(TTS){try{speechSynthesis.addEventListener("voiceschanged",fillVoices);}catch(e){speechSynthesis.onvoiceschanged=fillVoices;}} /* phones load voices late */

/* first visit opens the study guide; after that, where you left off */
tab(S.hist.length||S.tab!=="study"?S.tab:"study");
</script>
</body></html>
