<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Heads by Halves</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:opsz,wght@6..12,600;6..12,800&display=swap">
<style>
:root{--bg:#0a1628;--card:#15284a;--card2:#1d3358;--gold:#e6c25c;--gold-deep:#d4af37;--cream:#f1ede1;--muted:#9bb0d0;--good:#63d39a;--bad:#ef8f8c;--line:#28406a;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--cream);font-family:"Nunito Sans",system-ui,-apple-system,sans-serif;font-weight:600;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:14px max(16px,env(safe-area-inset-left)) calc(14px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font:400 1.05rem "Marcellus",Georgia,serif;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.9rem;color:var(--cream)}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;flex:1 0 auto;display:flex;flex-direction:column}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.85rem;font-weight:800}
.meta b{color:var(--gold)}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:55%}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--gold)}.dots i.cur{background:var(--cream)}
.head{font:400 clamp(1.45rem,6.2vw,2rem)/1.45 "Marcellus",Georgia,serif;margin:22px 0 10px;flex:1;display:flex;flex-direction:column;justify-content:center}
.head .s{color:var(--cream)}
.head .r{color:var(--gold)}
.head .h{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--gold-deep);height:1.05em;vertical-align:-.12em;margin:0 .08em}
.head .hint{color:#c8b46a;border-bottom:2px dashed var(--gold-deep)}
.say{color:var(--muted);font-size:.95rem;margin:0 0 12px;min-height:1.5em}
.say.good{color:var(--good)}
.btns{display:flex;gap:10px}
.b{flex:1;min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--cream);font-weight:800;font-size:1.05rem}
.b.main{background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#241800;border:none}
.b.ok{background:#1f4a3a;border-color:#2f7a5c;color:#d9ffe9}.b.no{background:#4a2426;border-color:#7a3a3c;color:#ffdede}
.b:active{transform:scale(.98)}
.nav{display:flex;gap:8px;margin-top:12px}
.nav .b{min-height:48px;font-size:.95rem;background:transparent}
.sheet{position:fixed;inset:0;background:rgba(5,10,20,.92);z-index:10;overflow:auto;padding:16px}
.sheet .in{max-width:640px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:12px 0}
.g{min-height:58px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--cream);font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;position:relative}
.g small{font-weight:600;font-size:.68rem;color:var(--muted)}
.g.ok{border-color:#2f7a5c;background:#163b30}.g.ok::after{content:"✓";position:absolute;top:3px;right:6px;font-size:.7rem;color:var(--good)}
.g.cur{outline:2px solid var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.note{color:var(--muted);font-size:.85rem}
@media (orientation:landscape) and (max-height:500px){.head{margin:10px 0 6px;font-size:1.35rem}.card{padding:12px 16px}.b{min-height:48px}}
</style></head><body>
<div class="wrap">
  <div class="top"><h1>Heads by Halves</h1><button class="chip" id="allB">✓ <span id="doneN">0</span>/68 · All heads</button></div>
  <div class="card">
    <div class="meta"><span id="where"></span><span class="dots" id="dots"></span></div>
    <div class="head" id="head" aria-live="polite"></div>
    <div class="say" id="say"></div>
    <div class="btns" id="askRow"><button class="b" id="hintB">💡 Next word</button><button class="b main" id="revB">Reveal</button></div>
    <div class="btns" id="markRow" hidden><button class="b no" id="noB">✗ Again</button><button class="b ok" id="okB">✓ Got it</button></div>
    <div class="nav"><button class="b" id="prevB">‹ Back</button><button class="b" id="mixB">🔀 Review</button><button class="b" id="nextB">Next ›</button></div>
  </div>
</div>
<div class="sheet" id="sheet" hidden><div class="in">
  <div class="top"><h1>All 68 Heads</h1><button class="chip" id="closeB">✕ Close</button></div>
  <p class="note">John Everard's 1650 translation · Book I, verses 14–81. Tap a head to practice it. Head 1 is verse 14.</p>
  <div class="grid" id="grid"></div>
  <div class="row"><button class="chip" id="restartB">↺ Restart this head</button><button class="chip" id="resetB">Clear all progress</button></div>
</div></div>
<script>
/* Heads by Halves — the first half of each Head stays; the second half disappears one word at a time from the end. */
const HEADS=[
[14,"All things that are moved, only that which is not is immoveable."],
[15,"Every body is changeable."],
[16,"Not every body is dissolveable."],
[17,"Some bodies are dissolveable."],
[18,"Every living being is not mortal."],
[19,"Nor every living thing is immortal."],
[20,"That which may be dissolved is also corruptible."],
[21,"That which abides always is unchangeable."],
[22,"That which is unchangeable is eternal."],
[23,"That which is always made is always corrupted."],
[24,"That which is made but once is never corrupted, neither becomes any other thing."],
[25,"Firstly, God; secondly, the World; thirdly, Man."],
[26,"The World for Man; Man for God."],
[27,"Of the Soul; that part which is sensible is mortal, but that part which is reasonable is immortal."],
[28,"Every Essence is immortal."],
[29,"Every Essence is unchangeable."],
[30,"Everything that is, is double."],
[31,"None of the things that are stand still."],
[32,"Not all things are moved by a soul, but everything that is, is moved by a soul."],
[33,"Everything that suffers is sensible; everything that is sensible, suffereth."],
[34,"Everything that is sad, rejoiceth also; and is a mortal living creature."],
[35,"Not everything that joyeth is also sad, but is an eternal living thing."],
[36,"Not every body is sick; every body that is sick is dissolveable."],
[37,"The mind in God."],
[38,"Reasoning (or disputing or discoursing) in Man."],
[39,"Reason in the Mind."],
[40,"The Mind is void of suffering."],
[41,"No thing in a body true."],
[42,"All that is incorporeal, is void of Lying."],
[43,"Everything that is made is corruptible."],
[44,"Nothing good upon Earth; nothing evil in Heaven."],
[45,"God is good; Man is evil."],
[46,"Good is voluntary, or of its own accord."],
[47,"Evil is involuntary, or against its will."],
[48,"The gods choose good things, as good things."],
[49,"Time is a Divine thing."],
[50,"Law is humane."],
[51,"Malice is the nourishment of the World."],
[52,"Time is the corruption of Man."],
[53,"Whatsoever is in Heaven is unalterable."],
[54,"All upon Earth is alterable."],
[55,"Nothing in Heaven is servanted; nothing upon Earth free."],
[56,"Nothing unknown in Heaven; nothing known upon Earth."],
[57,"The things upon Earth communicate not with those in Heaven."],
[58,"All things in Heaven are unblameable; all things upon Earth are subject to reprehension."],
[59,"That which is immortal is not mortal; that which is mortal is not immortal."],
[60,"That which is sown is not always begotten; but that which is begotten always is sown."],
[61,"Of a dissolveable body, there are two times; one for sowing to generation, one from generation to death."],
[62,"Of an everlasting Body, the time is only from the Generation."],
[63,"Dissolveable Bodies are increased and diminished."],
[64,"Dissolveable matter is altered into contraries; to wit, Corruption and Generation, but Eternal matter into itself, and its like."],
[65,"The Generation of Man is corruption; the Corruption of Man is the beginning of Generation."],
[66,"That which offsprings or begetteth another, is itself an offspring or begotten by another."],
[67,"Of things that are, some are in bodies, some in their IDEAS."],
[68,"Whatsoever things belong to operation or working, are in a body."],
[69,"That which is immortal, partakes not of that which is mortal."],
[70,"That which is mortal cometh not into a Body immortal; but that which is immortal cometh into that which is mortal."],
[71,"Operation or Workings are not carried upwards, but descend downwards."],
[72,"Things upon Earth, do nothing advantage those in Heaven; but all things in Heaven do profit and advantage all things upon Earth."],
[73,"Heaven is capable, and a fit receptacle of everlasting Bodies; the Earth of corruptible Bodies."],
[74,"The Earth is brutish; the Heaven is reasonable or rational."],
[75,"Those things that are in Heaven are subjected or placed under it, but the things on earth are placed upon it."],
[76,"Heaven is the first element."],
[77,"Providence is Divine order."],
[78,"Necessity is the Minister or Servant of Providence."],
[79,"Fortune is the carriage or effect of that which is without order; the Idol of operation, a lying Fantasie or opinion."],
[80,"What is God? The immutable or unalterable good."],
[81,"What is man? An unchangeable evil."]];
/* split: first ; or ? → else first comma (if both sides ≥2 words) → else middle */
const HH_SPLIT={31:6,57:4}; /* hand-set: "None of the things that are | stand still", "The things upon Earth | communicate not…" */
function hhSplit(v,t){const w=t.split(/\s+/);let k=HH_SPLIT[v]||-1;
  if(k<0)for(let i=0;i<w.length-1;i++)if(/[;?]$/.test(w[i])){k=i+1;break;}
  if(k<0)for(let i=1;i<w.length-2;i++)if(/,$/.test(w[i])){k=i+1;break;}
  if(k<0)for(let i=w.length-2;i>=1;i--)if(/^(is|are)$/i.test(w[i])){k=i;break;}
  if(k<0)for(let i=w.length-2;i>=1;i--)if(/^in$/i.test(w[i])){k=i;break;}
  if(k<0)k=Math.max(1,Math.floor(w.length/2));
  return {show:w.slice(0,k),hide:w.slice(k)};}

const KEY="heads-halves-v1";
function ld(){try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&typeof s.i==="number")return s;}catch(e){}return {i:0,r:1,done:[],mix:false};}
let S=ld();if(!Array.isArray(S.done))S.done=[];
function sv(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let phase="ask",hints=0,mixQ=[];
const $=id=>document.getElementById(id);
function cur(){const h=HEADS[S.i];const sp=hhSplit(h[0],h[1]);return {v:h[0],n:S.i+1,show:sp.show,hide:sp.hide};}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"})[c]);}
function draw(){const c=cur(),R=c.hide.length;S.r=Math.max(1,Math.min(R,S.r||1));
  const cut=c.hide.length-S.r; /* words of the second half still shown */
  let h='<span class="s">'+esc(c.show.join(" "))+'</span> ';
  c.hide.forEach((w,k)=>{if(k<cut)h+='<span class="s">'+esc(w)+'</span> ';else if(phase==="show")h+='<span class="r">'+esc(w)+'</span> ';else if(k<cut+hints)h+='<span class="r hint">'+esc(w)+'</span> ';else h+='<span class="h" aria-label="blank"></span> ';});
  $("head").innerHTML="<div>"+h+"</div>";
  $("where").innerHTML=(S.mix?"🔀 Review · ":"")+"Head <b>"+c.n+"</b> · verse "+c.v;
  let d="";for(let k=1;k<=R;k++)d+='<i class="'+(k<S.r?"on":k===S.r?"cur":"")+'"></i>';$("dots").innerHTML=d;
  $("say").className="say";$("say").textContent=phase==="show"?"Did you have it?":(S.r===1?"Say the missing word, then tap Reveal.":"Say the "+S.r+" missing words, then tap Reveal.");
  $("askRow").hidden=phase!=="ask";$("markRow").hidden=phase!=="show";
  $("hintB").disabled=hints>=S.r;$("hintB").style.opacity=hints>=S.r?.45:1;
  $("prevB").hidden=!!S.mix;$("doneN").textContent=S.done.length;$("mixB").textContent=S.mix?"↩ In order":"🔀 Review";
  sv();}
function go(i,r){S.i=(i+HEADS.length)%HEADS.length;S.r=r||1;phase="ask";hints=0;draw();}
function nextMix(){const pool=S.done.map(v=>HEADS.findIndex(h=>h[0]===v)).filter(i=>i>=0);if(!pool.length){S.mix=false;$("say").textContent="Master a head first — then Review mixes them up.";return false;}
  if(!mixQ.length){mixQ=pool.slice().sort(()=>Math.random()-.5);}let i=mixQ.shift();if(i===S.i&&mixQ.length)i=mixQ.shift();const c=hhSplit(HEADS[i][0],HEADS[i][1]);go(i,c.hide.length);return true;}
$("revB").onclick=()=>{phase="show";draw();};
$("hintB").onclick=()=>{if(hints<S.r){hints++;draw();}};
$("noB").onclick=()=>{phase="ask";hints=0;draw();};
$("okB").onclick=()=>{const c=cur();
  if(S.r<c.hide.length){S.r++;phase="ask";hints=0;draw();return;}
  if(S.done.indexOf(c.v)<0)S.done.push(c.v);sv();
  if(S.mix){nextMix();return;}
  go(S.i+1,1);$("say").className="say good";$("say").textContent="✓ Head "+c.n+" mastered. On to head "+(S.i+1)+".";};
$("prevB").onclick=()=>{if(S.mix){nextMix();return;}go(S.i-1,1);};
$("nextB").onclick=()=>{if(S.mix){nextMix();return;}go(S.i+1,1);};
$("mixB").onclick=()=>{if(S.mix){S.mix=false;go(S.i,1);return;}S.mix=true;mixQ=[];if(!nextMix()){S.mix=false;draw();$("say").textContent="Master a head first — then Review mixes them up.";}};
function grid(){const g=$("grid");g.innerHTML="";HEADS.forEach((h,i)=>{const b=document.createElement("button");b.className="g"+(S.done.indexOf(h[0])>=0?" ok":"")+(i===S.i?" cur":"");b.innerHTML=(i+1)+"<small>v."+h[0]+"</small>";b.onclick=()=>{S.mix=false;$("sheet").hidden=true;go(i,1);};g.appendChild(b);});}
$("allB").onclick=()=>{grid();$("sheet").hidden=false;$("resetB").textContent="Clear all progress";};
$("closeB").onclick=()=>{$("sheet").hidden=true;};
$("restartB").onclick=()=>{$("sheet").hidden=true;go(S.i,1);};
$("resetB").onclick=function(){if(!this.dataset.sure){this.dataset.sure=1;this.textContent="Tap again to clear all ✓ marks";return;}delete this.dataset.sure;S={i:0,r:1,done:[],mix:false};sv();grid();go(0,1);$("sheet").hidden=true;};
document.addEventListener("keydown",e=>{if(!$("sheet").hidden)return;if(e.key===" "||e.key==="Enter"){e.preventDefault();(phase==="ask"?$("revB"):$("okB")).click();}else if(e.key==="h"&&phase==="ask")$("hintB").click();else if(e.key==="x"&&phase==="show")$("noB").click();else if(e.key==="ArrowRight")$("nextB").click();else if(e.key==="ArrowLeft")$("prevB").click();});
if(S.mix&&!S.done.length)S.mix=false;
draw();
</script></body></html>
